# Same stack as Railway: billing + Postgres + WhatsApp (fixed monthly cost on a VPS).
# Usage: docker compose up --build -d
services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://postgres:postgres@db:5432/rinse_rise
      DATA_DIR: /app/data
      WHATSAPP_ENABLED: "1"
      # Override in .env if needed; local default stays 8 threads via entrypoint when RAILWAY_ENVIRONMENT is unset
      GUNICORN_THREADS: "2"
    volumes:
      - appdata:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rinse_rise
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rinse_rise"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
